name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Run tests
        env:
          RACK_ENV: test
          FINNHUB_API_KEY: fake_key_for_tests
        run: bundle exec rspec --format documentation

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rspec-results
          path: rspec.xml
